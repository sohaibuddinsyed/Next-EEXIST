version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@9
            - cd $CODEBUILD_SRC_DIR && pnpm install --no-frozen-lockfile
        build:
          commands:
            - cd $CODEBUILD_SRC_DIR && pnpm --filter web build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
